name: Deploy RAM to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: ram-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy Worker
        run: npx vinext deploy --name ram-clinic-manager

      - name: Configure RAM AI secret when available
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --name ram-clinic-manager
          else
            echo "OPENAI_API_KEY is not configured; core clinic app remains deployable and RAM AI will stay disabled."
          fi

      - name: Verify public Worker routes are disabled
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/ram-worker-route.json"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ram-clinic-manager/subdomain")"

          if [ "$http_status" != "200" ] || ! jq -e \
            '.success == true and .result.enabled == false and .result.previews_enabled == false' \
            "$response_file" > /dev/null; then
            echo "The RAM Worker still has a public workers.dev or preview route." >&2
            jq '{success, result, errors}' "$response_file" >&2 || true
            exit 1
          fi

          {
            echo "## RAM Cloudflare deployment"
            echo
            echo "- Worker: deployed"
            echo "- D1: connected and migrated"
            echo "- Public workers.dev route: disabled until Cloudflare Access is configured"
            echo "- Preview URLs: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show deployment status
        run: npx wrangler deployments list --name ram-clinic-manager

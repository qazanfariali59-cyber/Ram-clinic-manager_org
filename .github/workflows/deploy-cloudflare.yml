name: Deploy RAM to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: ram-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Ensure workers.dev subdomain is registered
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          response_file="$RUNNER_TEMP/workers-dev-subdomain.json"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "$api_url")"

          case "$http_status" in
            200)
              if ! jq -e '.success == true' "$response_file" > /dev/null; then
                jq -r '.errors[]? | "\(.code): \(.message)"' "$response_file" >&2
                exit 1
              fi
              subdomain="$(jq -r '.result.subdomain // empty' "$response_file")"
              ;;
            404)
              subdomain=""
              ;;
            *)
              echo "Cloudflare subdomain lookup failed with HTTP $http_status." >&2
              jq -r '.errors[]? | "\(.code): \(.message)"' "$response_file" >&2 || true
              exit 1
              ;;
          esac

          if [ -z "$subdomain" ]; then
            preferred_subdomain="ramclinic-${CLOUDFLARE_ACCOUNT_ID:0:12}"
            request_body="$(jq -nc --arg subdomain "$preferred_subdomain" '{subdomain: $subdomain}')"
            http_status="$(curl --silent --show-error \
              --request PUT \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$request_body" \
              "$api_url")"

            if [ "$http_status" != "200" ] || ! jq -e '.success == true' "$response_file" > /dev/null; then
              echo "Cloudflare workers.dev registration failed with HTTP $http_status." >&2
              jq -r '.errors[]? | "\(.code): \(.message)"' "$response_file" >&2 || true
              exit 1
            fi
            subdomain="$preferred_subdomain"
          fi

          worker_url="https://ram-clinic-manager.${subdomain}.workers.dev"
          echo "WORKERS_DEV_SUBDOMAIN=$subdomain" >> "$GITHUB_ENV"
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "workers.dev subdomain ready: $subdomain"

      - name: Deploy Worker
        run: npx vinext deploy --name ram-clinic-manager

      - name: Configure RAM AI secret when available
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --name ram-clinic-manager
          else
            echo "OPENAI_API_KEY is not configured; core clinic app remains deployable and RAM AI will stay disabled."
          fi

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          health_file="$RUNNER_TEMP/ram-health.json"
          for attempt in $(seq 1 12); do
            http_status="$(curl --silent --show-error --location --max-time 20 \
              --output "$health_file" \
              --write-out '%{http_code}' \
              "$WORKER_URL/api/health" || true)"
            if [ "$http_status" = "200" ] && jq -e \
              '.ok == true and .storage.ok == true and .storage.mode == "d1-binding"' \
              "$health_file" > /dev/null; then
              echo "RAM is healthy at $WORKER_URL"
              {
                echo "## RAM Cloudflare deployment"
                echo
                echo "- URL: [$WORKER_URL]($WORKER_URL)"
                echo "- D1: connected and migrated"
                echo "- Health check: passed"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "RAM health check failed at $WORKER_URL (last HTTP status: $http_status)." >&2
          jq '{ok, storage, ai, error}' "$health_file" >&2 || true
          exit 1

      - name: Show deployment status
        run: npx wrangler deployments list --name ram-clinic-manager
